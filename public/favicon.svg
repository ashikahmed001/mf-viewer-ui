<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="12" fill="#4f46e5"/>
  <!-- candle wicks -->
  <line x1="11" y1="7"  x2="11" y2="34" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="24" y1="9"  x2="24" y2="34" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  <line x1="37" y1="5"  x2="37" y2="34" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <!-- candle bodies -->
  <rect x="7.5"  y="12" width="7" height="16" rx="2" fill="white" opacity="0.55"/>
  <rect x="20.5" y="15" width="7" height="13" rx="2" fill="white" opacity="0.7"/>
  <rect x="33.5" y="9"  width="7" height="18" rx="2" fill="white"/>
  <!-- magnifier ring -->
  <circle cx="37" cy="36" r="9" fill="none" stroke="white" stroke-width="2.2"/>
  <circle cx="37" cy="36" r="9" fill="white" opacity="0.08"/>
  <!-- handle -->
